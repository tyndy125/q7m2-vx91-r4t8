name: Public Isolated Batch
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "factory/**"
      - "tests/**"
      - ".github/workflows/public-batch.yml"
permissions:
  contents: read
concurrency:
  group: public-isolated-batch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Package explicitly approved public jobs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -d jobs ] && find jobs -mindepth 2 -maxdepth 2 -name contract.json | grep -q .; then
            python factory/package_batch.py --source jobs --output dist --limit 16
          else
            echo "No approved public jobs; no artifact to upload."
          fi
      - name: Upload isolated packages
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-isolated-batch-${{ github.run_id }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 9
