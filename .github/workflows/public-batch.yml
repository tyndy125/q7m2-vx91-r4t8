name: Public Isolated Batch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'jobs/**'
      - 'factory/**'
      - '.github/workflows/public-batch.yml'
  pull_request:
    paths:
      - "factory/**"
      - "tests/**"
      - ".github/workflows/public-batch.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: public-isolated-batch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Prepare complete approved cooldown domain
        if: ${{ github.event_name != 'pull_request' }}
        run: python factory/prepare_approved_domain.py
      - name: Test approved public jobs and write full reports
        if: ${{ github.event_name != 'pull_request' }}
        run: python factory/run_batch_tests.py --source build/jobs --output reports
      - name: Bound public report storage
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python factory/artifact_budget.py reports
      - name: Upload test reports even on test failure
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-test-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 1
      - name: Package explicitly approved public jobs
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ -d jobs ] && find jobs -mindepth 2 -maxdepth 2 -name contract.json | grep -q .; then
            python factory/package_batch.py --source build/jobs --output dist --limit 16
          else
            echo "No approved public jobs; no artifact to upload."
          fi
      - name: Bound public package storage
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python factory/artifact_budget.py dist
      - name: Upload isolated packages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-isolated-batch-${{ github.run_id }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 9
